<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Play Epic Battle Sandbox CN: a browser-based single-player battle sandbox with partial Simplified Chinese UI, max-level troops and generous resources.">
<meta name="theme-color" content="#142b3d">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'unsafe-eval' blob:; connect-src 'self'; style-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'">
<title>Epic Battle Sandbox CN — Play</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="game.css">
</head>
<body>
<main><canvas id="unity-canvas" tabindex="0" aria-label="史诗战斗中文沙盒"></canvas></main>
<section id="loading" aria-live="polite">
  <h1>Epic Battle<br><span>Sandbox CN</span></h1>
  <p id="loading-status">正在准备战场…</p>
  <progress id="loading-progress" max="1" value="0" aria-label="游戏加载进度"></progress>
  <p class="hint" id="loading-hint">首次加载可能需要稍等片刻。</p>
  <button id="retry" type="button" hidden>重新加载</button>
  <p class="credit">Unofficial single-player modification · <a href="https://github.com/seiya058904/epic-battle-sandbox-cn">Project &amp; credits</a></p>
</section>
<noscript>请启用 JavaScript 后刷新页面，才能加载游戏。</noscript>
<script src="prefs-codec.js"></script>
<script src="local-mode.js"></script>
<script src="Build/EBS.loader.js"></script>
<script src="play.js"></script>
</body>
</html>
